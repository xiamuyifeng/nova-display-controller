[package]
name = "nova-display-controller"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "nova-display-controller"
description = "A customizable OLED controller for SteelSeries headset base stations"
license = "MIT"
repository = "https://github.com/xiamuyifeng/nova-display-controller"

[[bin]]
name = "nova-display-controller"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
image = "0.25"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
