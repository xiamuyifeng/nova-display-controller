name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check audio provider
        working-directory: extensions/providers/system-audio
        run: cargo check --locked

      - name: Check network provider
        working-directory: extensions/providers/system-network
        run: cargo check --locked
